[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "transistor-iv-analysis"
version = "1.0.0"
description = "Threshold voltage, subthreshold swing, mobility, hysteresis and trap density from transistor I-V curves"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dong-Joon Yi" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "pandas>=1.5",
    "matplotlib>=3.6",
    "xlrd>=2.0",
]
keywords = ["transistor", "TFT", "FET", "threshold voltage", "mobility", "subthreshold swing",
            "hysteresis", "Keithley 4200", "semiconductor characterization"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/iverydj/transistor-iv-analysis"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
